<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>শারদোৎসব পরিক্রমা</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- টপ ব্যানার ও দুর্গা-কাশফুল হিরো সেকশন -->
  <header class="puja-hero">
    <div class="overlay"></div>
    <div class="hero-content">
      <div class="trishul-icon">🔱</div>
      <h1>শারদোৎসব পরিক্রমা</h1>
      <p class="tagline">কাশফুলের দোলা, ঢাকের আওয়াজ আর আলোর উৎসব—তোমার পুজো সফর সহজ করতে</p>

      <!-- স্মার্ট সার্চ বার -->
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass search-ico"></i>
        <input type="text" id="pandalSearch" placeholder="প্যান্ডেল, এলাকা বা মেট্রোর নাম দিয়ে খুঁজুন (উদাঃ বাগবাজার, কল্যাণী, একডালিয়া)...">
      </div>

      <!-- এরিয়া ফিল্টার বাটন -->
      <div class="chip-container">
        <button class="chip active" data-zone="all">সব পুজো</button>
        <button class="chip" data-zone="North">উত্তর কলকাতা</button>
        <button class="chip" data-zone="South">দক্ষিণ কলকাতা</button>
        <button class="chip" data-zone="Central">সেন্ট্রাল</button>
        <button class="chip" data-zone="Salt Lake">সল্টলেক / শ্রীভূমি</button>
        <button class="chip" data-zone="Behala">বেহালা</button>
        <button class="chip" data-zone="Kalyani">কল্যাণী</button>
      </div>
    </div>
  </header>

  <!-- প্যান্ডেল গ্রিড সেকশন -->
  <main class="main-wrapper">
    <div class="counter-text" id="counterText">মোট ৩৫টি শীর্ষ পুজো পাওয়া গেছে</div>
    <div class="pandal-grid" id="grid">
      <!-- script.js থেকে কার্ড রেন্ডার হবে -->
    </div>
  </main>

  <footer>
    <p>মা আসছে | শুভ শারদীয়া 🪷</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
